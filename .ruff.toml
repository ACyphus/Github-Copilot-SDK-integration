# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "CPY001", # Existing GPL license is documented at the repository level
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN001", # Home Assistant fixture types are supplied by pytest
    "INP001", # Tests are not an application package
    "S101", # Assertions are expected in tests
    "S106", # Test credentials are inert placeholders
    "SLF001", # Unit tests exercise private integration seams
]
"scripts/*.py" = [
    "ANN001", # SDK callback types are generated unions
    "ANN202", # SDK permission callback returns generated union variants
    "T201", # Command-line scripts intentionally write status output
]
